# ~/.tmux.conf
# 说明:
# - 目标是最小但稳定的共享 tmux 基线
# - 不引入插件管理器，避免新机器首启依赖过多
# - tmux 文档: https://man7.org/linux/man-pages/man1/tmux.1.html

# 使用支持 256 色的终端类型，避免颜色和终端能力识别异常。
set -g default-terminal "tmux-256color"
# 每个 pane 保留更多历史输出，便于回看日志。
set -g history-limit 100000
# 开启鼠标支持：可直接点选 pane、拖动分隔线、滚轮滚动历史。
set -g mouse on
# copy mode / 滚动历史 / 文本选择等“模式按键”使用 vi 风格，而不是 emacs 风格。
setw -g mode-keys vi
# 窗口编号从 1 开始，而不是默认的 0。
set -g base-index 1
# pane 编号也从 1 开始，和窗口编号保持一致。
setw -g pane-base-index 1

# 恢复 tmux 默认前缀键 C-b，并移除旧的 C-a 前缀映射。
set -g prefix C-b
unbind C-a

# 常用分屏快捷键更贴近视觉方向。
# `prefix + |` 水平分屏，左右布局。
bind | split-window -h
# `prefix + -` 垂直分屏，上下布局。
bind - split-window -v

# 重新加载配置时给出明确反馈。
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# 机器本地覆盖入口，例如公司电脑上的剪贴板集成或平台专属设置。
if-shell '[ -f "$HOME/.tmux.conf.local" ]' 'source-file "$HOME/.tmux.conf.local"'
