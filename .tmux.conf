# ~/.tmux.conf
# 说明:
# - 目标是最小但稳定的共享 tmux 基线
# - 不引入插件管理器，避免新机器首启依赖过多
# - tmux 文档: https://man7.org/linux/man-pages/man1/tmux.1.html

set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1

# 使用更顺手的前缀键，同时保留 send-prefix。
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 常用分屏快捷键更贴近视觉方向。
bind | split-window -h
bind - split-window -v

# 重新加载配置时给出明确反馈。
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# 机器本地覆盖，例如公司电脑上的剪贴板集成。
if-shell '[ -f "$HOME/.tmux.conf.local" ]' 'source-file "$HOME/.tmux.conf.local"'
